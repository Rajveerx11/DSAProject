name: Validate music lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native, API, and frontend checks
        run: make check
      - name: Memory and undefined-behaviour checks
        run: make sanitize
      - name: Cache browser-test downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-musiclab-node22-playwright-1.56.1
      - name: Install isolated browser-test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/musiclab-browser-tools" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/musiclab-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real C-backed browser flows
        env:
          NODE_PATH: ${{ runner.temp }}/musiclab-browser-tools/node_modules
          MUSICLAB_EVIDENCE: ${{ runner.temp }}/musiclab-browser-evidence
        run: make test-browser
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musiclab-browser-evidence
          path: ${{ runner.temp }}/musiclab-browser-evidence
          if-no-files-found: ignore
